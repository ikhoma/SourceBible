<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SourceBible — Issue Board</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e4e7ec;
    --accent:#3085CF; --accent-soft:#e4eff9; --accent-ink:#1f5e9c;
    --col:#eef1f4; --shadow:0 1px 2px rgba(16,24,40,.06);
    --crash:#b42318; --high:#d2691e; --medium:#9a6d00; --low:#3f7d4e;
    --bug:#b42318; --ux:#7a5af8;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --surface:#1c2026; --ink:#e8eaed; --muted:#9aa1ab; --line:#2c323a;
      --accent:#5aa9e6; --accent-soft:#17293a; --accent-ink:#9cc8ef; --col:#171a1f;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --crash:#f97066; --high:#f3a05a; --medium:#e7c34a; --low:#7bbd86;
      --bug:#f97066; --ux:#a78bfa;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  header{padding:18px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  .titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .seg{display:inline-flex;background:var(--col);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
    padding:6px 14px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .wrap{padding:16px 24px 60px}
  .lane-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 2px 8px;display:flex;gap:8px;align-items:center}
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
  .col{flex:1 1 0;min-width:240px;background:var(--col);border-radius:var(--r);padding:10px}
  .col h2{font-size:12.5px;margin:4px 6px 10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between}
  .col h2 .n{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,transform .06s}
  .card:hover{border-color:var(--accent)}
  .card:active{transform:translateY(1px)}
  .ct{font-weight:600;line-height:1.35;margin:2px 0 8px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .id{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
  .chip{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .chip.mile{background:var(--accent);color:#fff}
  .sev{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
  .sev .dot{width:8px;height:8px;border-radius:50%}
  .tag-bug{color:var(--bug)} .tag-ux{color:var(--ux)}
  .verdict{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 6px;border-radius:5px}
  .v-real{background:rgba(180,35,24,.12);color:var(--crash)}
  .v-design{background:rgba(63,125,78,.14);color:var(--low)}
  .v-dup{background:rgba(107,114,128,.16);color:var(--muted)}
  .reporters{color:var(--muted);font-size:11.5px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0}
  .mhead h3{margin:6px 0 0;font-size:18px;font-weight:700;line-height:1.3}
  .mclose{float:right;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .mbody{padding:18px 22px 26px}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:0 0 16px;padding:14px;background:var(--col);border-radius:10px}
  .meta div span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
  .meta div b{font-weight:600;font-size:13.5px}
  .sec{margin:16px 0}
  .sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent-ink)}
  .sec p,.sec li{line-height:1.6;margin:0 0 6px}
  .sec ol{margin:0;padding-left:20px}
  .fix{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .invest{background:var(--col);border-radius:10px;padding:12px 14px}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--col);padding:1px 5px;border-radius:5px}
  .approve{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .approve button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer}
  .approve button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .approve button.design{border-color:var(--low);color:var(--low)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .scr{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12px;padding:8px 6px}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>SourceBible — Issue Board</h1>
    <span class="sub" id="sub"></span>
    <div class="seg" role="tablist">
      <button data-f="bug" aria-pressed="true">🐞 Bugs</button>
      <button data-f="ux" aria-pressed="false">💡 UX</button>
    </div>
  </div>
</header>
<div class="wrap" id="wrap"></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const ISSUES = [
  // ---- NEW BUGS (Sprint 1) ----
  {id:"bug-005",type:"bug",status:"done",title:"RST/UA: Word→Meaning labels & morphology show in English",area:"word-tab/localization",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Ukrainian UI + RST; Gen 1:21, Word → Meaning",source:"https://docs.google.com/document/d/131Qxtg7yofn0or6QNwNOrIJ0Acr3NTjsXhM8oeBwVKM",verdict:"part",confidence:"high (split)",screenshots:["30.jpg","30.1.jpg"],
   description:"Under Ukrainian UI + RST, the Meaning panel shows English: meaning text, the “Лексичне значення” label, and morphology names (Qal/Niphal/Piel).",
   steps:["Set UI to Ukrainian, translation to RST","Open Gen 1:21 → tap a word → Meaning"],
   investigation:"Split: (1) meaning/definition text EN = by design (Strong's long_def/short_def English for MVP, ADR-006). (2) \"Лексичне значення\" label EN = the String(localized:) swizzle-bypass cluster (see bug-018) — the uk row was NOT missing; all 272 keys already had uk. (3) Qal/Niphal/Piel = by-design Latin proper nouns; the earlier note about hardcoded literals at WordTabContent ~770–776 is STALE — hebrewStem() already routes through MorphKey/TranslationProvider.",
   fix:"Label half FIXED 2026-07-13 with the swizzle sweep. No fix for EN definition text (by-design, ADR-006)."},
  {id:"bug-006",type:"bug",status:"by-design",title:"RST: Verse→Original gloss shown in English",area:"reader/original-localization",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"RST; Gen 1:11, Verse → Original; “any book”",source:"https://docs.google.com/document/d/1juQYk66MMAjj5iUWYu0r7OCtuR1tCekGc7p6FzG1bzY",verdict:"design",confidence:"high",screenshots:["33.jpg"],
   description:"With RST active, the Verse → Original view shows the original-language gloss in English instead of matching RST. Reporter: any book.",
   steps:["Switch to RST","Open Gen 1:11 → Verse → Original"],
   investigation:"Mostly by design: Original tab shows word.gloss = English Macula gloss (DatabaseService.loadWords COALESCE of gloss_display/gloss_macula/gloss, ~219–221); no RST gloss column → English expected for MVP. Section & morphology labels DO localize (same xcstrings path as bug-005).",
   fix:"BY DESIGN 2026-07-14 (PDR-Lexicon-Language). The Original tab shows word.gloss = the English Macula gloss; there is no RST/UA gloss column in the DB, so English is expected for MVP (ADR-006, translated lexicon is a later stage). The LABEL half of the report was a real bug — the String(localized:) swizzle bypass — fixed under bug-005/018. Recorded in docs/ux/known-design-friction.md so repeat reports dedup."},
  {id:"bug-007",type:"bug",status:"done",title:"RST: cross references shown in both English and RST",area:"reader/cross-reference",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"RST; 2 Sam 22:51, Cross references",source:"https://docs.google.com/document/d/1n3gZe90wE5YpTyVLjoj1xzZmGCKpYJscndjDVf0h7-w",verdict:"real",confidence:"high",screenshots:["34.jpg"],
   description:"With RST active, cross references render in both English and RST. Expected: only RST.",
   steps:["Switch to RST","Open 2Цар 22:51 → Cross references"],
   investigation:"Real bug. DatabaseService.loadCrossReferences (~619–658) COALESCEs target text to a hardcoded defaultFallbackTranslation = \"KJV\" (line 40). When the RST row is absent it substitutes English; the query sets is_fallback → CrossReference.isFallback, but CrossRefsView (VerseTabContent.swift ~162–189) renders targetText and never reads the flag → mixed list.",
   fix:"In CrossRefsView, when ref.isFallback is true, suppress the English text and show the existing \"verse.text_unavailable\" placeholder (RST-only)."},
  {id:"bug-008",type:"bug",status:"done",title:"Word→Usage: inconsistent leading spaces (RST)",area:"reader/text-formatting",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"RST; 2 Sam 22:51, Word → Usage",source:"https://docs.google.com/document/d/1fTlOrIMWUfbGWmLxPp-Wo0EYNRWNJ2MwkpGDHgZkDqE",verdict:"real",confidence:"high",screenshots:["35.jpg"],
   description:"In Word → Usage, some lines start with a leading space, some don't.",
   steps:["Switch to RST","Open 2Цар 22:51 → Word → Usage"],
   investigation:"highlightedVerseText (WordTabContent.swift) builds each Usage snippet from per-segment stripKJVSegment() → strippingBibleMarkupKeepingSpaces(), which deliberately PRESERVES leading spaces (the source encodes inter-word spacing as a leading space per segment; trimming makes words run together — 'lodgedround aboutthe'). Correct between segments, but at the verse EDGES it leaks out as a stray indent: a verse whose first segment starts with a space renders indented, one that doesn't renders flush.",
   fix:"FIXED 2026-07-13: trim the leading space on the first segment and the trailing space on the last, after segmentation, before rendering. Inner spacing untouched. Build green; device-QA passed (no run-together words)."},
  {id:"bug-009",type:"bug",status:"done",title:"Leading-space inconsistency at Mark 1:29 (dup of bug-008)",area:"reader/text-formatting",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"RST; Mark 1:29",source:"https://docs.google.com/document/d/1hkyHBz2omK84ZlZXLcDpyvKng6iYDKUSjB8kKjv6lMY",verdict:"real",confidence:"high",screenshots:["36.jpg"],
   description:"Same leading-space inconsistency as bug-008, at Mark 1:29 under RST.",
   steps:["Switch to RST","Open Марк 1:29"],
   investigation:"Duplicate of bug-008 — same edge-whitespace leak in highlightedVerseText.",
   fix:"Fixed together with bug-008 (2026-07-13)."},
  {id:"bug-010",type:"bug",status:"done",title:"Henry commentary: TOC + nav buttons leak as trailing text",area:"commentaries",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Henry; Esther 3:7 / Judges 21:16–25, scrolled to end",source:"https://docs.google.com/document/d/1K885JiHVIeccronc1tXHVa8YgYmgCW5lcUN-bEedtuM",verdict:"real",confidence:"high",screenshots:["37.jpg","37.1.jpg"],
   description:"At the end of a Matthew Henry commentary, a table of contents plus Previous/Next/Free Download/Contact Us buttons appear as plain text.",
   steps:["Open Есф 3:7 → Henry comment (or Суд 21:16–25)","Scroll to the end"],
   investigation:"Real bug (data/import). In scripts/import_commentaries.py, _henry_extract_sections slices the last section to len(html) (line 281), and _strip_henry_html (215–224) removes only script/style/tags — not the site footer (TOC + Previous/Next/Free Download/Contact Us). Footer text gets stored on the last section.",
   fix:"FIXED (code) 2026-07-16: import_commentaries.py — _henry_extract_sections now truncates each chapter at its (End Body) comment marker before extracting sections, so the trailing site footer (Table of Contents / Previous / Next / BiblesNet / Free Download / Contact Us) no longer lands on the last section. Regex tolerates one malformed marker (Habakkuk 1). Verified read-only across all 1195 Henry chapters / 2653 sections: 0 footer leaks, 0 emptied sections; Judges 21 and Esther 3 now end on their real last sentence. REQUIRES a Mac-side rebuild to reach the app (bundled DB still dirty): run import_commentaries.py sourcebible.db, copy to SourceBible/Resources, then Clean Build. Not run from the Linux bridge (APFS sparse-file risk)."},
  {id:"bug-011",type:"bug",status:"done",title:"Search: big clear (X) button missing on 2nd word open",area:"search",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Search → open words from results repeatedly",source:"https://docs.google.com/document/d/10VjjUR8EU6_D-sonmpo2qvlENdqTsq9u4Ti4nn6UmUA",verdict:"real",confidence:"high",screenshots:["38.jpg","38.1.jpg"],
   description:"Opening a word from search a second time, the large clear (X) button next to the search field is gone (only inner one remains). Present on first open.",
   steps:["Open search, search 3 words","Open each word one by one","On 2nd word-open the big clear button is missing"],
   investigation:"Real bug. SearchView.swift — opening a result switches to the .bible tab; the system flips .searchable's isPresented binding (isSearchActive, line 18) to false on the hidden tab. On return, committedQuery is still set so results render, but the system search bar (with the big X) isn't active. First open still has isSearchActive = true.",
   fix:"FIXED 2026-07-16: SearchView.swift — added reassertSearchPresentationIfNeeded() which re-asserts isSearchActive=true when a committed results page is on screen (guard isShowingResults && !isSearchActive), then drops the keyboard on the next tick to keep the committed state keyboard-free. Restore is driven by .onChange(of: isSelectedTab) — reliable for a role: .search tab — with .onAppear as an idempotent backup. ContentView passes isSelectedTab: selectedTab == .search to both SearchView call sites. Cancel/X and mid-typing are untouched by the guard. Card moved to docs/bugs/done/. On-device check after Clean Build: big X returns on every re-open; no keyboard flash on return."},
  // ---- Sprint 1 · earlier reports (BUG 2–18), not yet investigated ----
  {id:"bug-012",type:"bug",status:"by-design",title:"Landscape mode does not work",area:"reader/orientation",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Rotate device horizontally",source:"https://docs.google.com/document/d/1lmPmrdrMmywM0moHl6stxjllmRupj6d7UU8KsN3-Kr0",verdict:"",confidence:"",screenshots:["1.jpg"],description:"Turning the phone horizontally does nothing — landscape mode doesn't work.",steps:["Open the app","Rotate the phone to landscape"],investigation:"Not yet investigated.",fix:""},
  {id:"bug-013",type:"bug",status:"new",title:"Privacy Policy page does not load (first open)",area:"onboarding/links",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"First-run Privacy Policy button",source:"https://docs.google.com/document/d/1M1D8pfMM9HLFJcBo8FAq-hHyySLGXmnVCOJCmCnYhFE",verdict:"",confidence:"",screenshots:["2.jpg","2.1.jpg"],description:"On first open, tapping the Privacy Policy button doesn't load the page.",steps:["First app open","Tap Privacy Policy"],investigation:"Not yet investigated.",fix:""},
  {id:"bug-014",type:"bug",status:"new",title:"Commentary renders as plain text (no titles/subtitles)",area:"commentaries/formatting",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Any book comment",source:"https://docs.google.com/document/d/13cyG8xsXYJSdVkoPDSGhb0mC_JTp8Q9VzADnutvW8NI",verdict:"",confidence:"",screenshots:["4.jpg"],description:"Any commentary is shown as flat plain text with no titles/subtitles.",steps:["Open any book comment"],investigation:"Not yet investigated.",fix:""},
  {id:"ux-019",type:"ux",status:"reviewed",reclassifiedFrom:"bug-015",title:"First-open OK feels like it does nothing (analytics consent)",area:"onboarding",impact:"low",effort:"low",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"First-launch analytics-consent card",source:"https://docs.google.com/document/d/1UB-G7e0xAwnGubGtx6lknSNRBKHKPdl1Ss5xlUc6o1k",verdict:"by-design",confidence:"high",screenshots:["5.jpg"],description:"On first launch, tapping OK on the Help-improve-Source-Bible card seems to do nothing; tester expected a next window / App Store review.",observation:"Add clearer feedback that OK registered, or accept as-is: today the only signal is the sheet dismissing over the already-visible reader.",investigation:"RECLASSIFIED from bug-015 - not a defect. The first-launch dialog is the one-time analytics consent card (AnalyticsConsentCard). OK (analytics.consent.accept) sets analyticsEnabled=true and dismisses the sheet; Not now sets it false; both set consentShown=true so it never shows again. Works as designed: there is no next window and no App Store review by design - the sheet just dismisses to reveal the reader already visible behind it, so the success feedback is subtle and reads as nothing happened.",fix:"Open - discoverability decision for Ivan: (A) accept as-is, behaviour is correct; (B) add a light confirmation (toast / checkmark) so OK feels acknowledged; or (C) a small cross-fade/haptic on dismiss. No behaviour change made; reclassified bug-015 -> ux-019 per Ivan."},
  {id:"bug-016",type:"bug",status:"done",title:"Calvin commentary shows empty state at random",area:"commentaries",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"John Calvin comment; Josh 17:2",source:"https://docs.google.com/document/d/1vsMDMukMnj5ysgNkbrBDt-E6R8ZUgIEunUD0Zcss6cA",verdict:"real",confidence:"high",screenshots:["6.jpg","6.1.jpg"],description:"Opening a John Calvin comment sometimes shows an empty state instead of the text (random across books; possibly empty content). Expected: don't offer a comment that has no text.",steps:["Open Josh 17:2 → John Calvin comment"],investigation:"ROOT CAUSE (2026-07-16): the picker offered a theologian via commentarySourcesAvailable(bookId:) — BOOK granularity (source has any section in the book) — while CommentaryDetailView loads per VERSE through the comment_verses index. Calvin/Henry modules are patchy (ADR-027: Calvin Isaiah stops at ch.48; gaps in Gen 10-30, John 6). At Josh 17:2 Calvin is listed because he has sections elsewhere in Joshua, but no comment_verses row covers 17:2 → loadCommentary returns nil → empty state. Not random: depends on whether the verse falls in that source coverage gap.",fix:"FIXED 2026-07-16: added per-verse commentarySourcesAvailable(bookId:chapter:verse:) that JOINs comment_verses and requires non-blank text; CommentariesView filters the picker on this per-verse set (.task keyed on verseId) and its empty state uses verse.commentary.unavailable. loadCommentary got the same non-blank filter + ORDER BY c.id LIMIT 1 so availability and load agree (no offered-but-empty from multi/blank rows). idx_cv(book_id,chapter,verse) confirmed. On-device check after Clean Build: at Josh 17:2 Calvin no longer listed, Henry still shown."},
  {id:"bug-017",type:"bug",status:"blocked",title:"Red-letter toggle: ASV has no red text",area:"reader/red-letters",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Red-letter ON; Mark 1; ASV",source:"https://docs.google.com/document/d/1R8dNe8zTJgVcPPvscq2cjoICaRyPopYGL4PZxoBe4do",verdict:"real",confidence:"high",screenshots:["7.jpg","7.1.jpg"],description:"With the red-letter toggle on, the ASV translation shows no red text. Expected: red letters in any translation.",steps:["Turn on red-letter toggle","Open Mark 1 in ASV"],investigation:"ROOT CAUSE (2026-07-14): not a code bug — the ASV SOURCE MODULE carries no red-letter markup. Counted <J> tags directly in the MyBible modules under data/: KJV+ 2051 verses, NASB+ 2047, RST+ 2060, ASV+ 0 of 31085. The app path is correct end-to-end (VerseParser <J> -> SegmentStyle.jesusWords -> VerseTextView.resolveColor -> .systemRed); there is simply nothing to color in ASV. Confirmed on Mark 1:15/1:17, which are red in KJV/NASB/RST and plain in ASV.",fix:"BLOCKED — needs a decision, two viable paths. (A) SYNTHESIZE the markup: for each KJV <J> span, locate its first/last Strong's number in the ASV verse and wrap that contiguous ASV run in <J>. Feasibility measured: 2038 of 2042 KJV red-letter verses have Strong's overlap with ASV; 1404 verses are fully-Jesus (whole-verse wrap, trivially safe), 647 are partial (narrative + speech, need span alignment). Would be a new scripts/add_asv_red_letters.py patching the verse table in place — no full rebuild — run on the Mac, plus a low-confidence report to eyeball. (B) GATE the toggle: detect that a translation carries no <J> and disable/hide the red-letter toggle for it, so it never silently does nothing — ships today but ASV readers never get red letters. Alternative to both: source a red-letter ASV module."},
  {id:"bug-018",type:"bug",status:"done",title:"Search placeholder stays English in Ukrainian UI",area:"localization/search",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Ukrainian interface",source:"https://docs.google.com/document/d/1Cotu146oYNhDpyQsrx6gzgupppClcEW4OEYMymNKOmc",verdict:"real",confidence:"high",screenshots:["9.jpg"],description:"In the Ukrainian interface the search placeholder stays English (Word or phrase…).",steps:["Ukrainian interface","Open search"],investigation:"ROOT CAUSE (2026-07-13, code audit): String(localized:) does NOT go through Bundle.localizedString(forKey:value:table:) — the only method the LocalizedBundle object_setClass swizzle overrides — so every such call site resolved against the system locale and returned English regardless of the in-app language. Text(\"key\")/LocalizedStringKey and NSLocalizedString DO go through the swizzle, which is why some strings localized and others did not. All uk rows were already present in Localizable.xcstrings (272/272) — nothing was missing. Call site: SearchView.swift:97 prompt: String(localized: \"search.prompt.keyword\").",fix:"FIXED 2026-07-13: swept all String(localized:) call sites → NSLocalizedString / Text(key). Build green; device-QA passed in UA UI. SearchView.swift → prompt: Text(\"search.prompt.keyword\")."},

  {id:"bug-025",type:"bug",status:"done",title:"Chapter label 'ch' not translated to 'гл' (UA)",area:"localization/reader",severity:"low",priority:"P3",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Ukrainian interface, book dropdown; any + RST",source:"https://docs.google.com/document/d/1YJc5IMh7NOtQUXJiA1WSHzn4ZQqV9CHNw48PalhrmNM",verdict:"real",confidence:"high",screenshots:["24.jpg","24.1.jpg"],description:"In the Ukrainian interface the chapter label shows English 'ch' instead of 'гл'. Tester also asks whether 'ch' should follow RST.",steps:["Ukrainian interface","Open book dropdown"],investigation:"ROOT CAUSE (2026-07-13, code audit): String(localized:) does NOT go through Bundle.localizedString(forKey:value:table:) — the only method the LocalizedBundle object_setClass swizzle overrides — so every such call site resolved against the system locale and returned English regardless of the in-app language. Text(\"key\")/LocalizedStringKey and NSLocalizedString DO go through the swizzle, which is why some strings localized and others did not. All uk rows were already present in Localizable.xcstrings (272/272) — nothing was missing. Call site: BookChapterPickerView.swift:76 (picker.chapters_count — the uk value 'гл.' was already in the catalog). Whether 'ch' should follow the RST TRANSLATION rather than the UI language is a product question, not part of this fix.",fix:"FIXED 2026-07-13: swept all String(localized:) call sites → NSLocalizedString / Text(key). Build green; device-QA passed in UA UI. BookChapterPickerView.swift → NSLocalizedString(\"picker.chapters_count\")."},
  {id:"bug-026",type:"bug",status:"done",title:"Bookmark saved against EN instead of RST",area:"bookmarks/translation",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"RST active, add bookmark",source:"https://docs.google.com/document/d/1tHr1haTA4h2ViYahvmWtTsUcmvTWkjF210PzP1q7f8c",verdict:"part",confidence:"high",screenshots:["26.jpg","26.1.jpg"],description:"With RST active, adding a bookmark stores it against the EN text instead of RST.",steps:["Switch to RST","Add a bookmark"],investigation:"NOT what the title says: the bookmark itself is translation-agnostic BY DESIGN (Bookmark stores only verseId, no translation column). The bug is in the PREVIEW — BookmarkCardView.loadVerseText() passed DatabaseService.defaultFallbackTranslation (hardcoded \"KJV\"), so the card always rendered English text even when the reader was in RST.",fix:"FIXED 2026-07-13: BookmarkCardView loads the preview with readerVM.currentTranslation.id and re-loads on translation change. Build green; device-QA passed. NOTE: verseIds are stored in the ACTIVE translation's versification — in RST Psalms 10–147 that number is wrong at the source (bug-029)."},

  {id:"bug-027b",type:"bug",status:"by-design",title:"English DEFINITION/gloss text in Strong's & phrases (UA+RST) — split from bug-027",area:"word-tab/localization",severity:"medium",priority:"P2",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Ukrainian interface + RST; Gen 1:12, Word scrolled",source:"https://docs.google.com/document/d/1F63unCifJgmr6J_cTicg8TweHv6QTFn5BjaANd5vmRM",verdict:"design",confidence:"high",screenshots:["28.jpg"],description:"Lexicon content — Strong's definitions, glosses, phrase translations — is English regardless of interface language. The data half of original bug-027 (split 2026-07-16; label half = bug-027a).",steps:["Ukrainian interface + RST","Gen 1:12 → open word → scroll"],investigation:"By design per ADR-006: the lexicon dataset (BDB/Thayer's-derived definitions and glosses) ships English-only for MVP. Translating lexical content is a separate future stage, not a localization bug.",fix:"By design — no fix until the translated-lexicon stage. Revisit when the Ukrainian lexicon dataset work is scheduled."},

  {id:"bug-029",type:"bug",status:"done",title:"RST Psalms use LXX chapter numbering — verse_map has no chapter dimension",area:"db/verse-map",severity:"high",priority:"P1",reporters:["Claude","Ivan"],device:"",ios:"",context:"RST; Psalms 10–147 (Synodal/LXX chapter numbering)",source:"Found while verifying the bug-007 fix (2026-07-13)",verdict:"real",confidence:"high",screenshots:[],
   description:"RST stores Psalms in Synodal/LXX chapter numbering (Ps 10–147 offset by one vs MT/KJV). Nothing in the app maps chapters between versification schemes — verse_map only maps trans_verse → macula_verse WITHIN an assumed-identical chapter. For RST Psalms that assumption is false, so the app aligns verses across two entirely different psalms. Everything downstream of verse_map (Оригінал, cross-refs both sides, Word Usage/concordance) is silently keyed to the wrong psalm. Pre-existing — NOT introduced by the bug-007 fix; bug-007 surfaced it.",
   steps:["Switch to RST","Open Пс 89:9 — Synodal Ps 89:9 = Hebrew/KJV Psalm 90:9","Open the Оригінал tab — the Hebrew shown is Ps 89:30, a different psalm"],
   investigation:"Confirmed on device (iPhone 17 Pro sim, iOS 26.5) 2026-07-13 and by code audit: verse_map(translation, book_id, chapter, trans_verse, macula_verse) keys on ONE chapter number, and every consumer (DatabaseService.findMaculaVerse / findTranslationVerse / convertVerse / loadConcordance / loadCrossReferences) joins vm.chapter = w.chapter. There is no chapter translation anywhere in the app. build_verse_map.py aligns translation chapter N against Macula chapter N by Strong-overlap — for RST Psalms those are different psalms, so the rows produced are noise rather than a mapping. Note: the design doc DDL (verse_versification_system_design.md) ALSO lacks a target-chapter column (to_ch) — it needs amending before implementation. 2 Sam 22:51 is unaffected (no chapter shift in its book).",
   fix:"FIXED 2026-07-15 via ADR-028: verse_map (57% wrong, 4 152 bad rows per check_versification.py) dropped and replaced by verse_org — curated UBS/Paratext .vrs source of truth, chapter on both sides, whole canon incl. NT, O3 gate + O2 verify in build_versification.py. Merged/split psalms handled explicitly; Оригінал (loadOriginalWords), cross-refs both sides and concordance all routed through verse_org (commits f56a02b, 86f2a79). On-device QA 2026-07-15: RST Пс 50/51, 1 Хр 6:5, Йоіл 3, Мал 4, Вих 8, Лев 6, Дан 4 — incl. this ticket\u2019s repro (RST Пс 89:9 → Heb Ps 90:9)."},
  {id:"bug-003",type:"bug",status:"done",title:"H3887a (last word) not highlighted in Verse text",area:"reader/lexicon",severity:"medium",priority:"P2",reporters:["—"],device:"",ios:"",context:"NASB extended Strong's mapping",source:"",verdict:"real",confidence:"high",screenshots:["bug-003-1.png"],
   description:"The last word H3887a, for which we created a mapping from extended NASB Strong's, isn't highlighted in the Verse text.",
   steps:[],investigation:"Root cause: segment-to-word matching resolved Strongs IDs with baseStrongsNumber only, which strips the letter suffix but does NOT resolve NASB extended numbers — so H3887a (Macula base 3887) never found its NASB segment S9238 (nasbExtendedOverride 9238 -> 3887) and selectedSegment stayed nil, hence no highlight. Repro: Ps 1:1 NASB, last word scoffers (לֵצִים).",fix:"FIXED: added ReaderViewModel.resolvedMaculaBase(_:) — strips the suffix, then applies nasbExtendedOverride. Since refactored so ALL consumers (highlight, clickableWordIDs, syncSegment, translationOrderedClickableWords) derive from the single canonical verseWordSegmentPairs, which applies resolvedMaculaBase on the segment side (ReaderViewModel.swift:369) and baseStrongsNumber on the Macula-word side (:361). VERIFIED 2026-07-14 on device by Ivan — works in ALL translations (NASB extended path resolves; KJV/RST unaffected, override is a no-op). Separate ticket bug-H341 (H341/H340) remains blocked."},
  {id:"bug-H341",type:"bug",status:"blocked",title:"H341 (“enemy”) non-clickable under NASB + wrong Strong's on long-tap",area:"translations/nasb",severity:"high",priority:"P1",reporters:["—"],device:"",ios:"",context:"NASB uses H340 where Macula uses H341 (272+ OT verses)",source:"",verdict:"real",confidence:"high",screenshots:[],
   description:"H341 renders non-clickable in the verse lexicon, and long-tap shows H340 in NASB vs H341 in KJV. Systemic across ~272 OT verses.",
   steps:[],investigation:"Documented in bug-H341-not-clickable-nasb-gating.md. NASB/Macula Strong's disagreement; needs a standard-number override map + discovery script.",fix:"Option A: nasbStandardOverride map (H340→H341) + discovery script (see the report). Needs a design decision → blocked."},

  {id:"ux-001",type:"ux",status:"done",title:"Swipe paging only works at screen edges (discoverability)",area:"reader/navigation",impact:"medium",effort:"medium",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Reader, turning pages",source:"https://docs.google.com/document/d/1MDVUwiTZwbAOFH2IseKpcOw9W9UqNEGVVd7HVScaSMU",verdict:"",confidence:"",screenshots:["1.jpg"],
   description:"Swipe-to-turn only responds in the edge zones. A tester swiped center, nothing happened, assumed it was broken. Retest: works.",
   observation:"Users naturally swipe anywhere; center swipe does nothing → feels broken even though edge-swipe works.",
   investigation:"Originally by-design (edge-only avoided clash with word tap/long-press/selection — see PDR-Page-Turn-Gesture-Zone). Implemented as a discoverability fix: replaced EdgeSwipeNavigator (edge-only) with UIPageViewController(.scroll) full-surface interactive swipe.",
   fix:"✓ Done (2026-07-10) — ADR-026 Phase 2 replaced reader chapter swap with UIPageViewController(.scroll), enabling full-surface horizontal swipe (both chevrons + center swipe turn pages). Device gesture-check passed (no clash with word tap/long-press/selection). PDR-Page-Turn-Gesture-Zone amended — edge-only → full-surface. iOS 18 fallback keeps edge-only until Phase B."},
  {id:"ux-002",type:"ux",status:"by-design",title:"Empty space at bottom of Cross Refs / Original / Meaning / Usage",area:"reader/layout",impact:"low",effort:"medium",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Scrolling to end of those tabs",source:"https://docs.google.com/document/d/1rln8bXtBeR9ILACpAALcURcPntvd-a4GI9TZMlJHzL8",verdict:"design",confidence:"",screenshots:["32.jpg","32.1.jpg","32.2.jpg","32.3.jpg"],
   description:"Scrolling to the end of Verse→Cross Refs / Original and Word→Meaning / Usage leaves a noticeable empty gap below the last item.",

   investigation:"By design — the bottom inset / trailing padding provides scroll room for the sheet (Study Mode ADR-021: studyScrollRoom constant). The gap ensures the last item can scroll to just below the sheet anchor without being obscured. Related to ux-013 (chapter end whitespace) which serves the same function.",

  {id:"ux-003",type:"ux",status:"done",title:"Smoother transition when navigating chapters (chevrons)",area:"reader/animation",impact:"medium",effort:"varies",reporters:["Viacheslav"],device:"iPhone 11",ios:"26.5",context:"Chapter navigation via chevrons (video 39.mp4)",source:"https://docs.google.com/document/d/1TFg2e9HS4CuqjDyVu906orSJWRa9wmye2wBf4w4DOSw",verdict:"",confidence:"",screenshots:["39.mp4 (video — manual review)"],
   description:"Tester's video shows moving between chapters with the ‹ › chevrons; asks for a smoother transition.",
   observation:"Chapter change should feel smooth like Apple Books, not an instant jump.",
   investigation:"Chevron button IS native (SwiftUI Button + SF Symbol in ToolbarItemGroup, ReaderView.swift ~278-308). But the transition is NOT animated: prevChapter/nextChapter (ReaderViewModel.swift 534-544) set currentChapter + loadChapter(); the reader is a ScrollView+ForEach (not TabView), so the chapter swaps instantly and scroll jumps to top. Apple Books research: Curl/Slide are for paginated fixed pages (curl = UIKit UIPageViewController.pageCurl); SourceBible scrolls (variable-length chapters), so curl doesn't fit — the Books-equivalent for a scroll reader is Slide/Fade.",
   fix:"RESOLVED (2026-07-10): ADR-026 Phase 2 implemented native animated slide via UIPageViewController(.scroll). TabView(.page) was tried first but rejected empirically (cover bleed dead, toolbar blur dead). UIKit pager ships cover bleed + Liquid Glass scroll-edge effect + full-surface swipe (both chevrons + horizontal swipe trigger slide). Study Mode ADR-021 pinning preserved. iOS 18 fallback = legacy non-paging reader. Verified: sim iOS 26.5 + device gesture-check by Ivan."},

const COLS = {
  bug:[["new","New"],["blocked","Blocked"],["by-design","By design"],["planned","Planned"],["done","Done"]],
  ux:[["new","New"],["reviewed","Reviewed"],["by-design","By design"],["planned","Planned"],["done","Done"]]
};
const SEVCOL={crash:"var(--crash)",high:"var(--high)",medium:"var(--medium)",low:"var(--low)"};
const VERD={real:["v-real","Bug"],design:["v-design","By design"],dup:["v-dup","Duplicate"],part:["v-real","Partial"]};
let filter = localStorage.getItem("sb_board_filter") || "bug";

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function cardHTML(it){
  const sev = it.type==="bug" && it.severity ? `<span class="sev"><span class="dot" style="background:${SEVCOL[it.severity]||'var(--muted)'}"></span>${it.severity}</span>` : "";
  const imp = it.type==="ux" && it.impact ? `<span class="chip">impact: ${it.impact}</span>` : "";
  const mile = it.milestone ? `<span class="chip mile">${esc(it.milestone)}</span>` : "";
  const v = it.verdict && VERD[it.verdict] ? `<span class="verdict ${VERD[it.verdict][0]}">${VERD[it.verdict][1]}</span>` : "";
  const rep = it.reporters && it.reporters[0] && it.reporters[0]!=="—" ? `<span class="reporters">· ${esc(it.reporters.join(", "))}</span>` : "";
  return `<div class="card" onclick="openModal('${it.id}')">
    <div class="row"><span class="id ${it.type==='bug'?'tag-bug':'tag-ux'}">${it.id}</span>${v}</div>
    <div class="ct">${esc(it.title)}</div>
    <div class="row"><span class="chip">${esc(it.area||'')}</span>${sev}${imp}${mile}${rep}</div>
  </div>`;
}

function boardHTML(type){
  const cols = COLS[type];
  const items = ISSUES.filter(i=>i.type===type);
  return `<div class="board">` + cols.map(([key,label])=>{
    const list = items.filter(i=>i.status===key);
    return `<div class="col"><h2>${label}<span class="n">${list.length}</span></h2>${
      list.length? list.map(cardHTML).join("") : '<div class="empty">—</div>'}</div>`;
  }).join("") + `</div>`;
}

function render(){
  const w = document.getElementById("wrap");
  const nb = ISSUES.filter(i=>i.type==="bug").length, nu = ISSUES.filter(i=>i.type==="ux").length;
  document.getElementById("sub").textContent = `${nb} bugs · ${nu} UX`;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.f===filter));
  w.innerHTML = boardHTML(filter);
}

function openModal(id){
  const it = ISSUES.find(i=>i.id===id); if(!it) return;
  const m = document.getElementById("modal");
  const meta = [
    ["Status", it.status],
    it.type==="bug"?["Severity", it.severity||"—"]:["Impact", it.impact||"—"],
    it.type==="bug"?["Priority", it.priority||"—"]:["Effort", it.effort||"—"],
    ["Area", it.area||"—"],
    ["Reporters",(it.reporters&&it.reporters.join(", "))||"—"],
    (it.device?["Device", it.device+(it.ios?" · iOS "+it.ios:"")]:null),
    (it.milestone?["Milestone", it.milestone]:null),
    (it.context?["Context", it.context]:null),
    (it.confidence?["Confidence", it.confidence]:null)
  ].filter(Boolean);
  const steps = (it.steps&&it.steps.length)?`<div class="sec"><h4>Steps to reproduce</h4><ol>${it.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:"";
  const obs = it.observation?`<div class="sec"><h4>Observation</h4><p>${esc(it.observation)}</p></div>`:"";
  const scr = (it.screenshots&&it.screenshots.length)?`<div class="sec"><h4>Screenshots</h4><p class="scr">Drive mailbox img/: ${it.screenshots.map(esc).join(", ")}</p></div>`:"";
  const src = it.source?`<div class="sec"><h4>Source</h4><p><a href="${it.source}" target="_blank" rel="noopener">Open original report ↗</a></p></div>`:"";
  m.innerHTML = `
    <div class="mhead">
      <button class="mclose" onclick="closeModal()">✕</button>
      <span class="id ${it.type==='bug'?'tag-bug':'tag-ux'}">${it.id}</span>
      <h3>${esc(it.title)}</h3>
    </div>
    <div class="mbody">
      <div class="meta">${meta.map(([k,v])=>`<div><span>${k}</span><b>${esc(String(v))}</b></div>`).join("")}</div>
      ${it.description?`<div class="sec"><h4>Description</h4><p>${esc(it.description)}</p></div>`:""}
      ${obs}${steps}
      ${it.investigation?`<div class="sec"><h4>Investigation</h4><div class="invest">${esc(it.investigation)}</div></div>`:""}
      ${it.fix?`<div class="sec"><h4>Proposed fix</h4><div class="fix">${esc(it.fix)}</div></div>`:""}
      ${scr}${src}
      <div class="approve">
        <button class="primary" onclick="copyPrompt('Implement ${it.id}: ${esc(it.title).replace(/'/g,"")}')">Copy “approve & fix” prompt</button>
        <button onclick="copyPrompt('Questions about ${it.id} before I approve')">Copy “ask first” prompt</button>
        <button class="design" onclick="copyPrompt('Mark ${it.id} as by-design — record it (PDR) and add it to docs/ux/known-design-friction.md with a discoverability decision (accept / affordance / tutorial)')">Copy “by design” prompt</button>
      </div>
      <div class="hint">Approval happens in chat. Click a button to copy a ready prompt, paste it to Claude — then the fix agent runs and the result is verified before merge.</div>
    </div>`;
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){document.getElementById("overlay").classList.remove("open");}
function copyPrompt(t){navigator.clipboard&&navigator.clipboard.writeText(t);}

document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f; localStorage.setItem("sb_board_filter",filter); render();
}));
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
render();
</script>
</body>
