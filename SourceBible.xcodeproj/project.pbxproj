		A5A0B0032FF0000000EDC19D /* Strip NASB (AppStore only) */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/sourcebible.db",
				"$(SRCROOT)/SourceBible/Resources/sourcebible.db",
				"$(SRCROOT)/scripts/strip_licensed_translation.py",
				"$(SRCROOT)/scripts/build_db.py",
			);
			name = "Strip NASB (AppStore only)";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(DERIVED_FILE_DIR)/strip-nasb.stamp",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "#!/bin/bash\n# App Store build ships WITHOUT NASB (no licence). Release/TestFlight keep the full DB.\n# Builds a stripped copy from the source DB (never modified) and replaces the copy that\n# Copy Bundle Resources put into the .app. Fails the build if NASB survives anywhere.\n# Sandboxing is off ONLY in the AppStore configuration (this phase writes into the .app).\n# Inputs include the BUNDLED DB: Copy Bundle Resources re-copies the full DB whenever it\n# sees its output changed (i.e. after every strip), and that fresh copy must be stripped\n# again. Inputs = only the source DB/scripts let a full NASB DB ship (caught 2026-10-17).\nset -euo pipefail\nSTAMP=\"${DERIVED_FILE_DIR}/strip-nasb.stamp\"\nmkdir -p \"${DERIVED_FILE_DIR}\"\nif [ \"${CONFIGURATION}\" != \"AppStore\" ]; then touch \"$STAMP\"; exit 0; fi\n\nPY=\"\"\nfor c in \"${STRIP_PYTHON:-}\" /usr/local/bin/python3 /opt/homebrew/bin/python3; do\n  if [ -n \"$c\" ] && [ -x \"$c\" ] && \"$c\" -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then PY=\"$c\"; break; fi\ndone\nif [ -z \"$PY\" ]; then\n  echo \"error: Strip NASB: no Python >= 3.10 found (/usr/bin/python3 is 3.9 and is not used). Set STRIP_PYTHON.\"\n  exit 1\nfi\n\nSRC=\"${SRCROOT}/SourceBible/Resources/sourcebible.db\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/sourcebible.db\"\nTMP=\"${DERIVED_FILE_DIR}/sourcebible.appstore.db\"\n[ -f \"$DST\" ] || { echo \"error: Strip NASB: $DST not found — did Copy Bundle Resources run?\"; exit 1; }\n\nSQLITE_TMPDIR=\"${DERIVED_FILE_DIR}\" \"$PY\" -u \"${SRCROOT}/scripts/strip_licensed_translation.py\" \"$SRC\" \"$TMP\" --translation NASB\nmv -f \"$TMP\" \"$DST\"\n# The stripped DB is journal_mode=DELETE; WAL side files copied from Resources/ are stale.\nrm -f \"$DST-wal\" \"$DST-shm\"\ntouch \"$STAMP\"\necho \"Strip NASB: bundled DB replaced ($DST)\"\n";
			showEnvVarsInLog = 0;
		};
