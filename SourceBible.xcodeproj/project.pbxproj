			shellScript = "#!/bin/bash\n# App Store build ships WITHOUT Spurgeon's \"Verse Expositions\" (source 'Spurgeon-VE'):\n# the shipped text is the Grace-eBooks.com 2011 compilation, © on the compilation\n# (legal/commentaries-provenance-2026-10-17.md). Treasury of David (Spurgeon-TOD, CC0) stays.\n# Release/TestFlight keep the full module. Same mechanism as \"Strip NASB\": a stripped copy\n# replaces the module Copy Bundle Resources put into the .app; the build fails if any VE\n# row, FTS entry or text byte survives. Inputs include the BUNDLED module (see Strip NASB).\nset -euo pipefail\nSTAMP=\"${DERIVED_FILE_DIR}/strip-spurgeon-ve.stamp\"\nmkdir -p \"${DERIVED_FILE_DIR}\"\nif [ \"${CONFIGURATION}\" != \"AppStore\" ]; then touch \"$STAMP\"; exit 0; fi\n\nPY=\"\"\nfor c in \"${STRIP_PYTHON:-}\" /usr/local/bin/python3 /opt/homebrew/bin/python3; do\n  if [ -n \"$c\" ] && [ -x \"$c\" ] && \"$c\" -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then PY=\"$c\"; break; fi\ndone\nif [ -z \"$PY\" ]; then\n  echo \"error: Strip Spurgeon-VE: no Python >= 3.10 found (/usr/bin/python3 is 3.9 and is not used). Set STRIP_PYTHON.\"\n  exit 1\nfi\n\nSRC=\"${SRCROOT}/SourceBible/Resources/commentaries-en.db\"\nDST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/commentaries-en.db\"\nTMP=\"${DERIVED_FILE_DIR}/commentaries-en.appstore.db\"\n[ -f \"$DST\" ] || { echo \"error: Strip Spurgeon-VE: $DST not found — did Copy Bundle Resources run?\"; exit 1; }\n\nSQLITE_TMPDIR=\"${DERIVED_FILE_DIR}\" \"$PY\" -u \"${SRCROOT}/scripts/strip_commentary_source.py\" \"$SRC\" \"$TMP\" --source Spurgeon-VE\nmv -f \"$TMP\" \"$DST\"\nrm -f \"$DST-wal\" \"$DST-shm\"\ntouch \"$STAMP\"\necho \"Strip Spurgeon-VE: bundled commentary module replaced ($DST)\"\n";
